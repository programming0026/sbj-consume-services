spring.application.name=sbj-consume-services
server.port=8080

# Servicio que se consume. Por defecto es el proveedor incluido en esta misma aplicación;
# cambia la URL para consumir otra API (debe tener las mismas rutas /products).
app.products.base-url=http://localhost:${server.port}/provider
app.products.connect-timeout-ms=1000
app.products.read-timeout-ms=500

# Tiempos de espera del cliente Feign "products"
spring.cloud.openfeign.client.config.products.connect-timeout=1000
spring.cloud.openfeign.client.config.products.read-timeout=500
spring.cloud.openfeign.client.config.products.logger-level=basic
logging.level.com.juniverse.consume.client.ProductFeignApi=DEBUG
